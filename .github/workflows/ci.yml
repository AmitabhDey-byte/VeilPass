name: VeilPass CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/rendered-html.test.mjs
      - run: npm run check:compact-source
      # Run this step in the Midnight toolchain image once the Compact CLI is available.
      - name: Check Compact source
        run: test -f contracts/veil-allowlist.compact
