name: VeilPass CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/rendered-html.test.mjs
      - run: npm run check:compact-source
      - name: Install Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
          compact update 0.31.0

      - name: Compile Compact contract
        run: compact compile contracts/veil-allowlist.compact managed/veil-allowlist

      - name: Verify generated contract artifacts
        run: |
          test -d managed/veil-allowlist/compiler
          test -d managed/veil-allowlist/contract
          test -d managed/veil-allowlist/keys
          test -d managed/veil-allowlist/zkir
